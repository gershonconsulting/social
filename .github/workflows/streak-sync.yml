name: Streak Client Sync

# Retired 2026-10-13: Olivier — "we don't need Streak". Schedule removed; the
# manual trigger is kept only so the job can be re-enabled without rewriting it.
on:
  workflow_dispatch:

jobs:
  streak-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Streak client sync
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CF_CRON_SECRET }}" \
            "https://social.gershon.ai/api/admin/streak-sync")
          echo "Streak sync response: $response"
          if [ "$response" != "200" ]; then
            echo "Streak sync failed with status $response"; exit 1
          fi
