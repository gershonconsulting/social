name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - claude/social-campaign-verification-jiG5E
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push Prisma schema to database
        run: npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: ${{ secrets.CF_DATABASE_URL }}

      - name: Build for Cloudflare Pages
        run: npx @cloudflare/next-on-pages
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_DATE: ${{ github.event.head_commit.timestamp }}
          NEXT_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy .vercel/output/static \
            --project-name gershoncrm-social \
            --commit-dirty=true

      - name: Set Cloudflare Pages secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.CF_DATABASE_URL }}" | npx wrangler pages secret put DATABASE_URL --project-name gershoncrm-social
          echo "https://social.gershoncrm.com" | npx wrangler pages secret put NEXTAUTH_URL --project-name gershoncrm-social
          echo "https://social.gershoncrm.com" | npx wrangler pages secret put NEXT_PUBLIC_APP_URL --project-name gershoncrm-social
          echo "${{ secrets.CF_NEXTAUTH_SECRET }}" | npx wrangler pages secret put NEXTAUTH_SECRET --project-name gershoncrm-social
          echo "${{ secrets.CF_CRON_SECRET }}" | npx wrangler pages secret put CRON_SECRET --project-name gershoncrm-social
          echo "${{ secrets.RESEND_API_KEY }}" | npx wrangler pages secret put RESEND_API_KEY --project-name gershoncrm-social
          echo "${{ vars.DIGEST_TO || 'oattia@gmail.com' }}" | npx wrangler pages secret put DIGEST_TO --project-name gershoncrm-social
          echo "${{ vars.DIGEST_FROM || 'onboarding@resend.dev' }}" | npx wrangler pages secret put DIGEST_FROM --project-name gershoncrm-social
          echo "${{ secrets.GOOGLE_SHEETS_SVC_JSON }}" | npx wrangler pages secret put GOOGLE_SHEETS_SVC_JSON --project-name gershoncrm-social
          echo "${{ secrets.CF_GOOGLE_CLIENT_ID }}" | npx wrangler pages secret put GOOGLE_CLIENT_ID --project-name gershoncrm-social
          echo "${{ secrets.CF_GOOGLE_CLIENT_SECRET }}" | npx wrangler pages secret put GOOGLE_CLIENT_SECRET --project-name gershoncrm-social
          echo "${{ secrets.CF_LINKEDIN_CLIENT_ID }}" | npx wrangler pages secret put LINKEDIN_CLIENT_ID --project-name gershoncrm-social
          echo "${{ secrets.CF_LINKEDIN_CLIENT_SECRET }}" | npx wrangler pages secret put LINKEDIN_CLIENT_SECRET --project-name gershoncrm-social
