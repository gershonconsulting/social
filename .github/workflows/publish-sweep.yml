name: Publishing sweep

# Every 15 minutes: confirm scheduled LinkedIn / X posts went out, mark
# missed or failed ones, email once per problem. Idempotent.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Sweep publishing
        run: |
          response=$(curl -s -o /tmp/sweep.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CF_CRON_SECRET }}" \
            "https://publish.gershon.ai/api/cron/publish-sweep")
          echo "HTTP $response"
          head -c 2000 /tmp/sweep.json; echo ""
          if [ "$response" != "200" ]; then exit 1; fi
