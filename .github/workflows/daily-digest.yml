name: Daily Digest Email
on:
  schedule:
    # 13:00 UTC = 09:00 ET — sends every morning
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Send daily digest
        run: |
          response=$(curl -s -o /tmp/digest.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CF_CRON_SECRET }}" \
            "https://social.gershoncrm.com/api/digest/daily")
          echo "HTTP $response"
          cat /tmp/digest.json | head -c 2000
          echo ""
          if [ "$response" != "200" ]; then
            echo "Digest send returned non-200"
            exit 1
          fi
