name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - claude/social-campaign-verification-jiG5E
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build for Cloudflare Pages
        run: npx @cloudflare/next-on-pages
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy .vercel/output/static \
            --project-name gershoncrm-social \
            --commit-dirty=true

      - name: Set Cloudflare Pages secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.CF_DATABASE_URL }}" | npx wrangler pages secret put DATABASE_URL --project-name gershoncrm-social
          echo "https://social.gershoncrm.com" | npx wrangler pages secret put NEXTAUTH_URL --project-name gershoncrm-social
          echo "${{ secrets.CF_NEXTAUTH_SECRET }}" | npx wrangler pages secret put NEXTAUTH_SECRET --project-name gershoncrm-social
          echo "${{ secrets.CF_CRON_SECRET }}" | npx wrangler pages secret put CRON_SECRET --project-name gershoncrm-social
